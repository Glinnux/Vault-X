    <line x1="256" y1="290" x2="256" y2="314" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="198" y1="256" x2="222" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
