<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault-X</title>
    <script>
      const base = "/Vault-X";
      const path = location.pathname.startsWith(base)
        ? location.pathname.slice(base.length)
        : location.pathname;
      const route = path + location.search + location.hash;
      location.replace(`${base}/?__route=${encodeURIComponent(route)}`);
    </script>
  </head>
  <body></body>
</html>
