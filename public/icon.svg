<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Obsidian Background Gradient -->
    <linearGradient id="vxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051710" />
      <stop offset="50%" stop-color="#030c08" />
      <stop offset="100%" stop-color="#020805" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="vxEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Titanium White / Mint Gradient -->
    <linearGradient id="vxWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Enclosure -->
  <rect width="512" height="512" rx="112" fill="url(#vxBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="6" />

  <!-- Radar & Orbital Grid Lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="2.5" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="2" />

  <!-- Diagonal Arm 1: Emerald (Top-Left to Bottom-Right) -->
  <path
    d="M 120 120 L 195 95 L 392 392 L 317 417 Z"
    fill="url(#vxEmerald)"
    filter="url(#emeraldGlow)"
  />

  <!-- Diagonal Arm 2: Titanium White (Top-Right to Bottom-Left) -->
  <path
    d="M 392 120 L 317 95 L 120 392 L 195 417 Z"
    fill="url(#vxWhite)"
  />

  <!-- Interlocking Vault Core Diamond -->
  <polygon
    points="256,180 332,256 256,332 180,256"
    fill="#042f22"
    stroke="#34d399"
    stroke-width="8"
  />

  <!-- High-Precision Safe Core & Aperture -->
  <circle cx="256" cy="256" r="54" fill="#064e3b" stroke="#10b981" stroke-width="6" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
  <circle cx="256" cy="256" r="12" fill="#042f22" />

  <!-- Vault Reticle Crosshairs -->
  <line x1="256" y1="198" x2="256" y2="222" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="290" x2="256" y2="314" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <line x1="198" y1="256" x2="222" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <line x1="290" y1="256" x2="314" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
</svg>
