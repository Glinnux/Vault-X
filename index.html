    <title>Vault-X | Secure Credential Management</title>
    <meta name="description" content="Organize and manage your digital credentials with Vault-X, a simple platform designed with security and privacy in mind." />
    <meta property="og:title" content="Vault-X | Secure Credential Management" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      const routeParams = new URLSearchParams(location.search);
      const requestedRoute = routeParams.get("__route");
      if (requestedRoute) {
        const base = location.pathname.startsWith("/Vault-X/") ? "/Vault-X" : "";
        const route = requestedRoute.startsWith("/") ? requestedRoute : `/${requestedRoute}`;
        history.replaceState(null, "", `${base}${route}`);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
